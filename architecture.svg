<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="480" rx="22" fill="#0f172a"/>
  <text x="40" y="52" fill="#f8fafc" font-size="28" font-weight="700">EarBridge</text>
  <text x="40" y="78" fill="#94a3b8" font-size="15">Live sound from your phone mic, played only in your good ear</text>

  <rect x="45" y="110" width="86" height="160" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="88" cy="252" r="6" fill="#38bdf8"/>
  <path d="M60 140h56M60 160h40M60 180h48" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <text x="88" y="295" fill="#e2e8f0" font-size="14" text-anchor="middle">Phone mic</text>

  <g font-size="14" fill="#f8fafc" text-anchor="middle">
    <rect x="170" y="130" width="150" height="76" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="245" y="160" font-weight="600">Noise cleanup</text>
    <text x="245" y="182" fill="#94a3b8" font-size="12">learns and removes hiss</text>

    <rect x="340" y="130" width="150" height="76" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="415" y="160" font-weight="600">Voice focus</text>
    <text x="415" y="182" fill="#94a3b8" font-size="12">clearer speech</text>

    <rect x="510" y="130" width="150" height="76" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="585" y="160" font-weight="600">Boost + soft limiter</text>
    <text x="585" y="182" fill="#94a3b8" font-size="12">0 to +24 dB, no harsh peaks</text>

    <rect x="680" y="130" width="150" height="76" rx="12" fill="#14532d" stroke="#22c55e"/>
    <text x="755" y="160" font-weight="600">Pan to good ear</text>
    <text x="755" y="182" fill="#bbf7d0" font-size="12">deaf side stays silent</text>
  </g>
  <path d="M133 168H168" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M322 168H338" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M492 168H508" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M662 168H678" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M832 168H866" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <circle cx="918" cy="120" r="26" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="918" y="126" fill="#94a3b8" font-size="18" text-anchor="middle" font-weight="700">L</text>
  <path d="M900 102L936 138M936 102L900 138" stroke="#ef4444" stroke-width="3" opacity=".8"/>
  <text x="918" y="166" fill="#94a3b8" font-size="12" text-anchor="middle">deaf ear</text>
  <circle cx="918" cy="226" r="26" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="918" y="232" fill="#f0fdf4" font-size="18" text-anchor="middle" font-weight="700">R</text>
  <path d="M954 212q10 14 0 28M964 204q16 22 0 44" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <text x="918" y="272" fill="#bbf7d0" font-size="12" text-anchor="middle">good ear</text>

  <rect x="150" y="318" width="835" height="140" rx="16" fill="none" stroke="#334155" stroke-dasharray="6 6"/>
  <text x="170" y="344" fill="#fbbf24" font-size="14" font-weight="600">Deaf-side alert (experimental)</text>
  <path d="M88 272V400H148" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="14" fill="#f8fafc" text-anchor="middle">
    <rect x="170" y="370" width="170" height="64" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="255" y="397" font-weight="600">Left / right mic</text>
    <text x="255" y="417" fill="#94a3b8" font-size="12">compare loudness</text>

    <rect x="370" y="370" width="170" height="64" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="455" y="397" font-weight="600">Calibration</text>
    <text x="455" y="417" fill="#94a3b8" font-size="12">which side is deaf</text>

    <rect x="570" y="370" width="170" height="64" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="655" y="397" font-weight="600">New sound?</text>
    <text x="655" y="417" fill="#94a3b8" font-size="12">starts on deaf side</text>

    <rect x="770" y="370" width="195" height="64" rx="12" fill="#422006" stroke="#f59e0b"/>
    <text x="867" y="397" font-weight="600">Alert</text>
    <text x="867" y="417" fill="#fde68a" font-size="12">tick, screen glow, vibration*</text>
  </g>
  <path d="M342 402H368" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M542 402H568" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M742 402H768" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="985" y="472" fill="#64748b" font-size="11" text-anchor="end">*vibration only works on browsers that allow it, Safari does not</text>
</svg>
